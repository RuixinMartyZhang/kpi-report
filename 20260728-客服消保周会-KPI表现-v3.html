// ========== 月度表格（含rowspan） ==========
function wrapName(name) {
    if (name.includes('（不含北互金）')) {
        return name.replace('（不含北互金）', '<span class="suffix">（不含北互金）</span>');
    }
    return name;
}

function renderMonthTable() {
    const th = ['考核类型', '指标分类', '指标名称', '权重', '月目标', '26年7月MTD达成',
                '26年6月MTD达成', '26年5月MTD达成', '26年6月全月达成', '26年5月全月达成',
                '26年4月全月达成', '26年3月全月达成', '26年2月全月达成', '26年1月全月达成'];
    let html = '<thead><tr>';
    th.forEach(c => html += '<th>' + c + '</th>');
    html += '</tr></thead><tbody>';

    // 大类之间的视觉分隔
    let lastCat = '';
    monthData.forEach((r, i) => {
        if (lastCat && r.cat !== lastCat) {
            html += '<tr class="blank-row"><td colspan="15"></td></tr>';
        }
        lastCat = r.cat;

        html += '<tr>';
        if (r.is_first_in_cat) {
            html += '<td class="cat-cell" rowspan="' + r.cat_span + '">' + r.cat + '</td>';
        }
        if (r.is_first_in_dist) {
            html += '<td class="dist-cell" rowspan="' + r.dist_span + '">' + r.dist + '</td>';
        }
        html += '<td class="name-cell gray-bg">' + wrapName(r.name) + '</td>';
        html += '<td class="gray-bg">' + r.weight + '</td>';
        html += '<td style="font-weight:700;">' + r.target + '</td>';
        html += '<td' + (r.m7_meet ? ' class="meet"' : '') + '>' + r.m7 + '</td>';
        html += '<td' + (r.m6_meet ? ' class="meet"' : '') + '>' + r.m6 + '</td>';
        html += '<td' + (r.m5_meet && r.name !== '外诉率' ? ' class="meet"' : '') + '>' + r.m5 + '</td>';
        html += '<td' + (r.full1_meet ? ' class="meet"' : '') + '>' + r.full1 + '</td>';
        html += '<td' + (r.full2_meet ? ' class="meet"' : '') + '>' + r.full2 + '</td>';
        html += '<td' + (r.full3_meet ? ' class="meet"' : '') + '>' + r.full3 + '</td>';
        html += '<td' + (r.full4_meet ? ' class="meet"' : '') + '>' + r.full4 + '</td>';
        html += '<td' + (r.full5_meet ? ' class="meet"' : '') + '>' + r.full5 + '</td>';
        html += '<td' + (r.full6_meet ? ' class="meet"' : '') + '>' + r.full6 + '</td>';
        html += '</tr>';
    });
    html += '</tbody>';
    document.getElementById('monthTable').innerHTML = html;
}

// ========== 月度结论 ==========
function renderMonthConclusions() {
    let html = '<strong style="font-size:14px;">▎月度KPI达成目标</strong><br>';
    html += monthConc.join('<br>');
    document.getElementById('monthConclusions').innerHTML = html;
}

// ========== 周度表格（含rowspan） ==========
function renderWeekTable() {
    const displayWeeks = weekLabelsFull.slice().reverse(); // 2026年第29周 .. 2026年第22周
    const displayQj = weekQj.slice().reverse();
    const latestWeek = displayWeeks[0];
    const latestQj = displayQj[0];
    const idxMap = [7,6,5,4,3,2,1,0]; // displayWeeks[j] 对应后端 weekData 的 w* 索引

    const row1 = ['考核类型', '指标分类', '指标名称', 'Week VS Week<br>涨幅', 'Week VS Week<br>变化', ...displayWeeks, '<span style="display:inline-block;width:120px;">趋势图</span>'];
    const row2 = ['', '', '', latestQj, latestQj, ...displayQj, ''];

    let html = '<thead>';
    // 第一行表头
    html += '<tr>';
    row1.forEach((c, i) => {
        if (i < 3 || i === row1.length - 1) {
            html += '<th rowspan="2">' + c + '</th>';
        } else {
            html += '<th>' + c + '</th>';
        }
    });
    html += '</tr>';
    // 第二行表头（日期区间）
    html += '<tr>';
    for (let i = 3; i < row1.length - 1; i++) {
        html += '<th>' + row2[i] + '</th>';
    }
    html += '</tr>';
    html += '</thead><tbody>';

    let lastCat = '';
    weekData.forEach((r, i) => {
        if (lastCat && r.cat !== lastCat) {
            html += '<tr class="blank-row"><td colspan="14"></td></tr>';
        }
        lastCat = r.cat;

        html += '<tr>';
        if (r.is_first_in_cat) {
            html += '<td class="cat-cell" rowspan="' + r.cat_span + '">' + r.cat + '</td>';
        }
        if (r.is_first_in_dist) {
            html += '<td class="dist-cell" rowspan="' + r.dist_span + '">' + r.dist + '</td>';
        }
        html += '<td class="name-cell">' + wrapName(r.name) + '</td>';
        html += '<td class="' + r.wow_cls + '">' + r.wow + '</td>';
        html += '<td class="' + r.wow_cls + '">' + r.wow_abs + '</td>';
        idxMap.forEach(j => html += '<td>' + r['w' + j] + '</td>');
        html += '<td style="width:120px; padding:4px;">' + (r.sparkline || '-') + '</td>';
        html += '</tr>';
    });
    html += '</tbody>';
    document.getElementById('weekTable').innerHTML = html;
}

// ========== 周度结论 ==========
function renderWeekConclusions() {
    let html = '<strong style="font-size:14px;">▎7月周度趋势</strong><br>';
    html += weekConc.join('<br>');
    document.getElementById('weekConclusions').innerHTML = html;
}



renderMonthTable();
renderMonthConclusions();
renderWeekTable();
renderWeekConclusions();
